services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: aiimage
      POSTGRES_PASSWORD: aiimage
      POSTGRES_USER: aiimage
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aiimage -d aiimage"]
      interval: 2s
      timeout: 2s
      retries: 20
    volumes:
      - postgres-data:/var/lib/postgresql/data

  redis:
    image: redis:8-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 2s
      retries: 20
    volumes:
      - redis-data:/data

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z@sha256:a1ea29fa28355559ef137d71fc570e508a214ec84ff8083e39bc5428980b015e
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-local-development-secret}
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-aiimage}
    ports:
      - "9000:9000"
      - "9001:9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 2s
      timeout: 2s
      retries: 20
    volumes:
      - minio-data:/data

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    command: ["sh", "-c", "alembic upgrade head && aiimage-bootstrap && uvicorn aiimage.api.main:app --host 0.0.0.0 --port 8000"]
    environment: &backend-environment
      AIIMAGE_ENV: development
      AIIMAGE_DATABASE_URL: postgresql+asyncpg://aiimage:aiimage@postgres:5432/aiimage
      AIIMAGE_REDIS_URL: redis://redis:6379/0
      AIIMAGE_S3_ENDPOINT: http://minio:9000
      AIIMAGE_S3_BUCKET: aiimage-assets
      AIIMAGE_S3_ACCESS_KEY: ${MINIO_ROOT_USER:-aiimage}
      AIIMAGE_S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-local-development-secret}
      AIIMAGE_SECRET_KEY_BASE64: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      AIIMAGE_JWT_SECRET: local-development-jwt-secret-change-before-deploy
      AIIMAGE_BOOTSTRAP_ADMIN_EMAIL: admin@aiimage.local
      AIIMAGE_BOOTSTRAP_ADMIN_PASSWORD: LocalOnly-ChangeMe-2026
      AIIMAGE_WORKER_MAX_CONCURRENCY: 4
      AIIMAGE_WORKER_MAX_ATTEMPTS: 3
      AIIMAGE_WORKER_RETRY_BASE_SECONDS: 5
      AIIMAGE_ALLOW_PRIVATE_PROVIDER_URLS: "true"
      AIIMAGE_PROVIDER_CONCURRENCY_LIMITS: '{"generic_http":2,"comfyui":1}'
    ports:
      - "8000:8000"
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
      minio: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health/live')"]
      interval: 3s
      timeout: 3s
      retries: 30

  worker:
    build:
      context: .
      dockerfile: backend/Dockerfile
    command: ["aiimage-worker"]
    environment: *backend-environment
    depends_on:
      api: {condition: service_healthy}

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    environment:
      API_BASE_URL: http://api:8000/api/v1
    ports:
      - "3000:3000"
    depends_on:
      api: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3000/login"]
      interval: 3s
      timeout: 3s
      retries: 30

volumes:
  minio-data:
  postgres-data:
  redis-data:
