[project]
name = "aiimage"
version = "0.1.0"
license = "GPL-3.0-only"
requires-python = ">=3.13,<3.14"
dependencies = [
  "alembic>=1.16,<2",
  "argon2-cffi>=25,<26",
  "asyncpg>=0.30,<1",
  "boto3>=1.40,<2",
  "cryptography>=50.0.0,<51",
  "fastapi==0.128.8",
  "httpx>=0.28,<1",
  "openpyxl>=3.1,<4",
  "pillow>=11,<12",
  "pydantic==2.13.4",
  "pydantic-settings>=2.10,<3",
  "pyjwt>=2.10,<3",
  "python-multipart>=0.0.20,<1",
  "redis>=6,<7",
  "sqlalchemy[asyncio]==2.0.52",
  "uvicorn[standard]>=0.35,<1",
]

[dependency-groups]
dev = [
  "aiosqlite>=0.21,<1",
  "pytest==8.4.2",
  "pytest-asyncio>=1,<2",
  "ruff>=0.12,<1"
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project.scripts]
aiimage-api = "aiimage.api.main:run"
aiimage-worker = "aiimage.worker.main:main"
aiimage-benchmark = "aiimage.benchmark.cli:main"
aiimage-bootstrap = "aiimage.auth.bootstrap:main"

[project.urls]
Homepage = "https://github.com/atyunfeng/AI_image2"
Repository = "https://github.com/atyunfeng/AI_image2.git"
Issues = "https://github.com/atyunfeng/AI_image2/issues"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py313"
