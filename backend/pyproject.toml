[project]
name = "aiimage"
version = "0.1.0"
license = "AGPL-3.0-only"
requires-python = ">=3.13,<3.14"
dependencies = [
  "alembic>=1.19.1,<2",
  "argon2-cffi>=25.1.0,<26",
  "asyncpg>=0.31.0,<1",
  "boto3>=1.43.83,<2",
  "cryptography>=50.0.1,<51",
  "fastapi==0.141.1",
  "httpx>=0.28.1,<1",
  "openpyxl>=3.1.5,<4",
  "pillow>=12.3,<13",
  "pydantic==2.13.5",
  "pydantic-settings>=2.15.0,<3",
  "pyjwt>=2.13.0,<3",
  "python-multipart>=0.0.32,<1",
  "redis>=8.1.0,<9",
  "sqlalchemy[asyncio]==2.0.52",
  "uvicorn[standard]>=0.52.4,<1",
]

[dependency-groups]
dev = [
  "aiosqlite>=0.22.1,<1",
  "pytest==9.1.1",
  "pytest-asyncio>=1.4.0,<2",
  "ruff>=0.16.5,<1"
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project.scripts]
aiimage-api = "aiimage.api.main:run"
aiimage-worker = "aiimage.worker.main:main"
aiimage-benchmark = "aiimage.benchmark.cli:main"
aiimage-bootstrap = "aiimage.auth.bootstrap:main"

[project.urls]
Homepage = "https://github.com/atyunfeng/AI_image2"
Repository = "https://github.com/atyunfeng/AI_image2.git"
Issues = "https://github.com/atyunfeng/AI_image2/issues"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py313"
